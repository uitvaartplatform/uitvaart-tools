<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Persoonlijk advertentieadvies | Uitvaart-Platform.nl</title>
<style>
/* ===================== INSTELLINGEN: PAS DIT AAN ===================== */
/* Zie het JavaScript-blok onderaan voor de PRIJS-TOKEN en de PRIJZEN.  */
:root{
  --plum:#4a1942; --plum2:#6b3060; --plumlogo:#6C3D5C;
  --orange:#e8834a; --orange2:#c8622a;
  --cream:#faf7f2; --cream2:#f3ece3; --lav:#c9bcd2;
  --ink:#1e1520; --muted:#6b5a66; --line:#e7dde6;
  --ok:#3f9d6e;
  --sans:'Poppins','Nunito Sans',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:
  radial-gradient(1200px 600px at 50% -10%, rgba(232,131,74,.10), transparent 60%),
  linear-gradient(160deg,#fbf8f4 0%,#f4ecf1 100%);
  min-height:100%;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
.wrap{width:100%;max-width:780px;margin:0 auto;padding:22px 18px 60px;flex:1;display:flex;flex-direction:column}

/* header */
.top{display:flex;align-items:center;gap:12px;justify-content:center;margin:6px 0 18px}
.top .bfly{width:40px;height:40px;border-radius:11px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(74,25,66,.12)}
.top .bfly svg{width:24px;height:24px}
.top b{font-weight:700;color:var(--plum);font-size:1.02rem;letter-spacing:.2px}

/* kaart */
.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 50px rgba(74,25,66,.10);overflow:hidden;flex:1;display:flex;flex-direction:column}
.pad{padding:30px 30px 26px;flex:1;display:flex;flex-direction:column;overflow-y:auto}
@media(max-width:560px){.pad{padding:24px 20px}}

/* progress */
.bar{height:5px;background:var(--cream2)}
.bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--orange),var(--orange2));border-radius:0 4px 4px 0;transition:width .45s cubic-bezier(.22,1,.36,1)}

/* screens */
.screen{display:none;animation:fade .45s ease both}
.screen.on{display:flex;flex-direction:column;margin:auto 0}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.eyebrow{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff;font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:6px 13px;border-radius:50px;margin-bottom:16px;box-shadow:0 4px 12px rgba(200,98,42,.3)}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
h1{font-size:clamp(1.5rem,3.6vw,2.05rem);line-height:1.2;color:var(--plum);letter-spacing:-.01em;margin-bottom:12px}
h2{font-size:clamp(1.25rem,3vw,1.5rem);line-height:1.25;color:var(--plum);margin-bottom:8px;letter-spacing:-.01em}
.lead{font-size:1.02rem;color:var(--muted);line-height:1.65;margin-bottom:18px}
.q{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--orange2);margin-bottom:8px}
.vraag{font-size:1.28rem;font-weight:700;color:var(--plum);line-height:1.3;margin-bottom:18px}

/* stats strip */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0 4px}
.stat{background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center}
.stat b{display:block;font-size:1.35rem;color:var(--orange2);line-height:1;margin-bottom:4px}
.stat span{font-size:.72rem;color:var(--muted);font-weight:600}

/* options */
.opts{display:flex;flex-direction:column;gap:11px}
.opt{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:15px;padding:15px 16px;cursor:pointer;font-family:var(--sans);font-size:1rem;color:var(--ink);transition:border-color .15s,background .15s,transform .12s,box-shadow .15s}
.opt:hover{border-color:var(--orange);box-shadow:0 8px 20px rgba(232,131,74,.12);transform:translateY(-2px)}
.opt.sel{border-color:var(--orange);background:linear-gradient(135deg,rgba(232,131,74,.1),rgba(232,131,74,.04))}
.opt .ic{width:42px;height:42px;flex-shrink:0;border-radius:11px;background:var(--cream2);display:flex;align-items:center;justify-content:center;font-size:1.25rem}
.opt.sel .ic{background:linear-gradient(135deg,var(--orange),var(--orange2))}
.opt .tx{flex:1}
.opt .tx b{display:block;font-weight:600;color:var(--plum);font-size:1.02rem}
.opt .tx small{color:var(--muted);font-size:.85rem}
.opt .chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.opt.sel .chk{background:var(--orange);border-color:var(--orange)}
.opt .chk svg{width:13px;height:13px;opacity:0;transition:opacity .15s}
.opt.sel .chk svg{opacity:1}
.hint{font-size:.82rem;color:var(--muted);margin-top:12px;text-align:center}

/* inputs */
.field{margin-bottom:14px}
.field label{display:block;font-size:.85rem;font-weight:600;color:var(--plum);margin-bottom:6px}
.field input{width:100%;border:2px solid var(--line);border-radius:13px;padding:14px 15px;font-family:var(--sans);font-size:1rem;color:var(--ink);background:#fff;transition:border-color .15s}
.field input:focus{outline:none;border-color:var(--orange)}

/* buttons */
.row-btns{display:flex;gap:11px;margin-top:22px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:none;cursor:pointer;font-family:var(--sans);font-weight:700;font-size:1.02rem;border-radius:14px;padding:15px 26px;transition:transform .15s,box-shadow .15s,filter .15s;position:relative;overflow:hidden}
.btn.primary{background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff;box-shadow:0 8px 22px rgba(200,98,42,.32);flex:1}
.btn.primary:hover{transform:translateY(-2px);filter:brightness(1.05);box-shadow:0 12px 28px rgba(200,98,42,.42)}
.btn.primary:active{transform:scale(.98)}
.btn.primary::after{content:'';position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(120deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);animation:shine 5s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,55%{left:-70%}78%{left:130%}100%{left:130%}}
.btn.ghost{background:transparent;color:var(--plum2);border:2px solid var(--line);padding:15px 20px}
.btn.ghost:hover{border-color:var(--plum2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.big{font-size:1.1rem;padding:17px 30px;width:100%}

/* result */
.advies-kop{text-align:center;margin-bottom:6px}
.kicker{display:inline-flex;align-items:center;gap:7px;background:rgba(63,157,110,.12);color:var(--ok);font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:6px 13px;border-radius:50px;margin-bottom:14px}
.pkg{border:2px solid var(--orange);border-radius:18px;padding:22px;margin:18px 0;background:linear-gradient(135deg,rgba(232,131,74,.07),rgba(232,131,74,.02));position:relative}
.pkg .tag{position:absolute;top:-12px;left:22px;background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff;font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 12px;border-radius:50px;box-shadow:0 4px 10px rgba(200,98,42,.3)}
.pkg h3{font-size:1.3rem;color:var(--plum);margin:4px 0 2px}
.pkg .prijs{font-size:1.05rem;font-weight:700;color:var(--orange2);margin-bottom:12px}
.pkg.kies{border-color:var(--line);background:#fff;cursor:pointer;padding-right:52px;transition:border-color .15s,box-shadow .15s,background .15s}
.pkg.kies:hover{border-color:var(--orange);box-shadow:0 8px 20px rgba(232,131,74,.12)}
.pkg.kies.sel{border-color:var(--orange);background:linear-gradient(135deg,rgba(232,131,74,.08),rgba(232,131,74,.02));box-shadow:0 8px 22px rgba(232,131,74,.16)}
.pkg-radio{position:absolute;top:18px;right:18px;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:#fff;transition:all .15s}
.pkg.kies.sel .pkg-radio{border-color:var(--orange);box-shadow:inset 0 0 0 4px var(--orange)}
.feat{display:flex;align-items:flex-start;gap:10px;margin:9px 0;font-size:.95rem;color:var(--ink);line-height:1.5}
.feat .v{width:20px;height:20px;border-radius:50%;background:rgba(63,157,110,.15);color:var(--ok);flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px}
.feat .v svg{width:11px;height:11px}
.addon{border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin:11px 0;background:#fff}
.addon .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}
.addon .h b{color:var(--plum);font-size:1.02rem}
.addon .h .p{color:var(--orange2);font-weight:700;font-size:.9rem;white-space:nowrap}
.addon p{font-size:.88rem;color:var(--muted);line-height:1.55}
.sectie-t{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--plum2);margin:24px 0 10px}

/* why block */
.why{background:var(--plum);border-radius:18px;padding:24px;margin:22px 0;color:#fff;position:relative;overflow:hidden}
.why::before{content:'';position:absolute;top:-80px;right:-80px;width:240px;height:240px;background:radial-gradient(circle,rgba(232,131,74,.25),transparent 70%)}
.why h3{color:#fff;font-size:1.15rem;margin-bottom:14px;position:relative}
.why .pt{display:flex;gap:11px;margin:11px 0;position:relative;font-size:.93rem;line-height:1.55;color:rgba(255,255,255,.92)}
.why .pt .e{font-size:1.1rem}
.why .pt b{color:#fff}

.reassure{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;margin:18px 0 6px}
.reassure span{font-size:.85rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.reassure span .v{color:var(--ok);font-weight:800}

.fineprint{font-size:.78rem;color:var(--muted);text-align:center;margin-top:14px;line-height:1.5}
.footer-note{text-align:center;font-size:.78rem;color:var(--muted);margin-top:18px}
.footer-note a{color:var(--plum2);font-weight:600;text-decoration:none}

/* gate */
.gate{max-width:440px;margin:8vh auto 0;text-align:center}
.gate .bfly-big{width:64px;height:64px;border-radius:18px;background:#fff;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;margin-bottom:18px;box-shadow:0 8px 22px rgba(74,25,66,.14)}
.gate .bfly-big svg{width:38px;height:38px}
.gate .err{color:#c0392b;font-size:.88rem;margin-top:10px;min-height:18px}
.print-hide{}
@media print{.print-hide{display:none!important}.why{background:#4a1942!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>

var answers={};
var step=-2; /* -2 = gate, -1 = intro, 0..n = vragen, n = resultaat */

function setProgress(){
  var total=vragen.length;
  var p=0;
  if(step>=0 && step<total) p=(step/total)*100;
  else if(step>=total) p=100;
  else p=0;
  prog.style.width=p+'%';
}

/* ---------- VRAGEN ---------- */
function renderVraag(){
  setProgress();
  var v=vragen[step];
  var cur=answers[v.key];
  if(cur===undefined){ cur = v.def ? v.def.slice() : (v.multi?[]:null); if(v.def) answers[v.key]=cur; }
  var html='<div class="screen on">';
  html+='<div class="q">Vraag '+(step+1)+' van '+vragen.length+'</div>';
  html+='<div class="vraag">'+v.q+'</div>';
  html+='<div class="opts">';
  v.opts.forEach(function(o){
    var sel = v.multi ? (cur.indexOf(o.v)>-1) : (cur===o.v);
    html+='<button class="opt'+(sel?' sel':'')+'" data-v="'+o.v+'" onclick="pick(\''+o.v+'\','+(o.solo?'true':'false')+')">'+
            '<span class="ic">'+o.ic+'</span>'+
            '<span class="tx"><b>'+o.t+'</b>'+(o.s?'<small>'+o.s+'</small>':'')+'</span>'+
            '<span class="chk">'+CHK+'</span>'+
          '</button>';
  });
  html+='</div>';
  if(v.multi) html+='<p class="hint">Je mag meerdere opties kiezen</p>';
  html+='<div class="row-btns">';
  if(step>0) html+='<button class="btn ghost" onclick="prev()">Terug</button>';
  html+='<button class="btn primary" id="nextbtn" onclick="next()"'+(canNext()?'':' disabled')+'>'+(step===vragen.length-1?'Bekijk mijn advies':'Volgende')+' &rarr;</button>';
  html+='</div></div>';
  stage.innerHTML=html;
}
function canNext(){
  var v=vragen[step]; var cur=answers[v.key];
  if(v.multi) return cur&&cur.length>0;
  return !!cur;
}
function pick(val,solo){
  var v=vragen[step];
  if(v.multi){
    var arr=answers[v.key]||[];
    if(solo){ arr=(arr.indexOf(val)>-1)?[]:[val]; }
    else{
      var i=arr.indexOf(val);
      if(i>-1) arr.splice(i,1); else arr.push(val);
      arr=arr.filter(function(x){var o=v.opts.find(function(z){return z.v===x;});return !(o&&o.solo);});
    }
    answers[v.key]=arr;
    renderVraag();
  }else{
    answers[v.key]=val;
    renderVraag();
    setTimeout(next,230);
  }
}
function next(){ if(!canNext())return; if(step<vragen.length-1){step++;renderVraag();}else{step=vragen.length;renderResultaat();} }
function prev(){ if(step>0){step--;renderVraag();} }

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function enc(s){return encodeURIComponent(String(s));}
function lab(key,val){var v=vragen.find(function(x){return x.key===key;});if(!v)return val||'';var o=v.opts.find(function(z){return z.v===val;});return o?o.t:(val||'');}
function labs(key,arr){return (arr||[]).filter(Boolean).map(function(x){return lab(key,x);}).join(', ');}

function kies(id){
  window.KEUZE=id;
  (window.KEUZES||[]).forEach(function(k){var el=document.getElementById('pkg-'+k.id);if(el)el.classList.toggle('sel',k.id===id);});
  var b=document.getElementById('startbtn'); if(b) b.disabled=false;
}

function verstuurAdvies(){
  var a=window.ADVIES||{};
  function fld(id){ var e=document.getElementById(id); return e?e.value.trim():''; }
  var onContact=!!document.getElementById('c-naam');
  var naam=onContact?fld('c-naam'):(CONTACT||'');
  var mail=onContact?fld('c-mail'):MAIL;
  var tel =(document.getElementById('c-tel'))?fld('c-tel'):TEL;
  var web =(document.getElementById('c-web'))?fld('c-web'):WEBSITE;
  if(onContact){
    if(TOONPRIJZEN){
      if(!naam || !mail || !web){
        var er=document.getElementById('c-err'); if(er) er.textContent='Vul je naam, e-mailadres en website in, zodat we alle gegevens bij de hand hebben.';
        return;
      }
    } else if(!naam || (!mail && !tel)){
      var er2=document.getElementById('c-err'); if(er2) er2.textContent='Vul je naam in en een e-mailadres of telefoonnummer, zodat we contact met je kunnen opnemen.';
      return;
    }
  }
  var btn=document.getElementById('startbtn');
  if(btn){ btn.disabled=true; btn.innerHTML='Bezig met versturen...'; }
  var keuze=(window.KEUZES||[]).find(function(k){return k.id===window.KEUZE;});
  var keuzeTxt=keuze?(keuze.titel+' ('+keuze.prijs+')'):(a.pakket||'');
  var bericht=
    'Nieuwe aanvraag via de advies tool.\n\n'+
    'Bedrijf: '+(a.bedrijf||'')+'\n'+
    'Contactpersoon: '+(naam||'-')+'\n'+
    'E-mailadres: '+(mail||'-')+'\n'+
    'Telefoonnummer: '+(tel||'-')+'\n'+
    'Website: '+(web||'-')+'\n'+
    'Type onderneming: '+(a.type||'')+'\n'+
    'GEKOZEN PAKKET (voorkeur): '+keuzeTxt+'\n'+
    'Geadviseerd basispakket: '+(a.pakket||'')+'\n'+
    'Doelen: '+(a.doelen||'')+'\n'+
    'Zichtbaarheid: '+(a.zicht||'')+'\n'+
    'Aanvullende diensten: '+(a.diensten||'')+'\n'+
    'Alles-in-een gepresenteerd: '+(a.allesin||'')+'\n'+
    'Aanbevolen aanvullingen: '+(a.aanvullingen||'')+'\n'+
    'Gewenste start: '+(a.termijn||'')+'\n';
  var klaar=false;
  function done(){ if(klaar) return; klaar=true; bedankt(); }
  if(!WEB3FORMS_KEY){ done(); return; }
  var data=new FormData();
  data.append('access_key',WEB3FORMS_KEY);
  data.append('subject','Nieuwe adviesaanvraag: '+(a.bedrijf||'onbekend'));
  data.append('from_name','Uitvaart-Platform adviestool');
  if(mail.indexOf('@')>0) data.append('email',mail);
  data.append('Bedrijf',(a.bedrijf||''));
  data.append('Contactpersoon',(naam||'-'));
  data.append('E-mailadres',(mail||'-'));
  data.append('Telefoonnummer',(tel||'-'));
  data.append('Website',(web||'-'));
  data.append('Gekozen pakket',keuzeTxt);
  data.append('bericht',bericht);
  data.append('botcheck','');
  var t=setTimeout(done,9000);
  fetch('https://api.web3forms.com/submit',{ method:'POST', headers:{'Accept':'application/json'}, body:data })
    .then(function(){ clearTimeout(t); done(); })
    .catch(function(){ clearTimeout(t); done(); });
}

function bedankt(){
  setProgress();
  var dank = TOONPRIJZEN
    ? 'We hebben je keuze ontvangen en nemen zo snel mogelijk persoonlijk contact met je op om jouw onderneming zichtbaar te maken bij onze bezoekers. Je hoeft verder niets te doen.'
    : 'We hebben je keuze ontvangen en nemen zo snel mogelijk persoonlijk contact met je op om de mogelijkheden en de tarieven met je door te nemen, zodat we jouw onderneming zichtbaar kunnen maken bij onze bezoekers. Je hoeft verder niets te doen.';
  stage.innerHTML='<div class="screen on" style="text-align:center;padding:14px 0 8px">'+
    '<span class="kicker" style="margin-bottom:16px">'+CHKg+' Verzonden</span>'+
    '<h2>Bedankt'+(BEDRIJF?(', '+esc(BEDRIJF)):'')+'</h2>'+
    '<p class="lead">'+dank+'</p>'+
    '<div class="reassure"><span><span class="v">\u2713</span> Reactie binnen 1 werkdag</span><span><span class="v">\u2713</span> Vrijblijvend en zonder verplichtingen</span></div>'+
    '<button class="btn ghost print-hide" style="margin-top:18px" onclick="window.print()">Mijn advies opslaan</button>'+
    '</div>';
  window.scrollTo({top:0,behavior:'smooth'});
}

/* start */
step=-1; renderIntro();
</script>
