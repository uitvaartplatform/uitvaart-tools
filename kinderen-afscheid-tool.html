*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  font-family:var(--tekst); color:var(--inkt); line-height:1.55;
  -webkit-font-smoothing:antialiased; overflow-x:hidden; min-height:100%;
  background:linear-gradient(180deg,var(--sky-1) 0%, var(--sky-2) 42%, var(--sky-3) 100%);
}
h1,h2,h3,.kop{ font-family:var(--kop); }

/* ---------- wereld-achtergrond ---------- */
.ka-wereld{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
.ka-zon{ position:absolute; top:-60px; right:-40px; width:200px; height:200px; border-radius:50%;
  background:radial-gradient(circle at 50% 50%, #fff1c2, #ffd45e 60%, rgba(255,212,94,0) 72%);
  animation:zonpuls 6s ease-in-out infinite; }
@keyframes zonpuls{ 0%,100%{ transform:scale(1); opacity:.9;} 50%{ transform:scale(1.06); opacity:1;} }
.ka-wolk{ position:absolute; background:#fff; border-radius:100px; opacity:.85;
  box-shadow:0 14px 30px rgba(120,150,180,.18); animation:zweef linear infinite; }
.ka-wolk::before,.ka-wolk::after{ content:''; position:absolute; background:#fff; border-radius:50%; }
.ka-wolk::before{ width:60%; height:160%; left:10%; top:-55%; }
.ka-wolk::after{ width:50%; height:140%; right:8%; top:-40%; }
@keyframes zweef{ from{ transform:translateX(-30vw);} to{ transform:translateX(130vw);} }
.ka-vlinder,.ka-hart{ position:absolute; font-size:26px; opacity:.55; animation:dwarrel ease-in-out infinite; }
@keyframes dwarrel{ 0%{ transform:translateY(0) rotate(-6deg);} 50%{ transform:translateY(-26px) rotate(10deg);} 100%{ transform:translateY(0) rotate(-6deg);} }
.ka-heuvel{ position:absolute; bottom:-40px; width:140%; left:-20%; height:230px; border-radius:50% 50% 0 0;
  background:linear-gradient(180deg,#a7dcae,#86cf94); opacity:.7; }
.ka-heuvel.twee{ bottom:-70px; height:180px; background:linear-gradient(180deg,#bfe6c4,#9ad6a3); opacity:.55; left:-10%; width:120%; }

/* ---------- app-kader ---------- */
.ka-app{ position:relative; z-index:1; max-width:1040px; margin:0 auto; padding:16px 16px 40px; min-height:100vh; display:flex; flex-direction:column; justify-content:center; }
@media(max-width:600px){ .ka-app{ padding:10px 10px 28px; } }

/* topbalk */
.ka-top{ display:flex; align-items:center; gap:12px; margin-bottom:14px; padding:10px 14px;
  background:rgba(255,255,255,.72); backdrop-filter:blur(8px); border:2px solid #fff; border-radius:100px; box-shadow:var(--sch-s); }
.ka-top-logo{ width:34px; height:30px; flex:0 0 auto; background:var(--logo) center/contain no-repeat; }
.ka-top-titel{ font-family:var(--kop); font-weight:600; color:var(--paars); font-size:1.05rem; line-height:1; }
.ka-top-titel small{ display:block; font-family:var(--tekst); font-weight:400; font-size:.66rem; color:var(--zacht); letter-spacing:.02em; }
.ka-top-knoppen{ margin-left:auto; display:flex; gap:8px; }
.ka-rond{ width:42px; height:42px; border-radius:50%; border:2px solid var(--lijn); background:#fff; cursor:pointer;
  font-size:1.1rem; display:flex; align-items:center; justify-content:center; transition:transform .2s var(--boing), background .2s; color:var(--paars); }
.ka-rond:hover{ transform:scale(1.1); background:var(--room); }
.ka-rond:active{ transform:scale(.92); }
.ka-rond.uit{ opacity:.45; }

/* hoofdpaneel */
.ka-vak{ position:relative; background:var(--wit); border:3px solid #fff; border-radius:var(--rad-l);
  box-shadow:var(--sch-l); overflow:hidden; }
.ka-vak::before{ content:''; position:absolute; inset:0; pointer-events:none; z-index:0;
  background:radial-gradient(90% 60% at 50% -10%, rgba(255,212,94,.16), transparent 60%); }

/* maatje-strip bovenin paneel */
.ka-strip{ position:relative; z-index:1; display:flex; align-items:flex-end; gap:14px; padding:18px 22px 10px; }
.ka-maatje{ flex:0 0 auto; width:88px; height:88px; position:relative; animation:bob 3s ease-in-out infinite; }
@keyframes bob{ 0%,100%{ transform:translateY(0) rotate(-2deg);} 50%{ transform:translateY(-8px) rotate(2deg);} }
.ka-maatje svg{ width:100%; height:100%; overflow:visible; }
.ka-maatje .oog-lid{ transform-origin:center; transform:scaleY(0); transition:transform .12s; }
.ka-maatje.knipper .oog-lid{ transform:scaleY(1); }
.ka-maatje.hop{ animation:hop .5s var(--boing); }
@keyframes hop{ 0%{ transform:translateY(0);} 40%{ transform:translateY(-18px) scale(1.06);} 100%{ transform:translateY(0);} }
.ka-bubbel{ position:relative; background:var(--room); border:2px solid #fff; border-radius:20px 20px 20px 6px;
  padding:13px 17px; box-shadow:var(--sch-s); flex:1; min-width:0; font-weight:500; color:var(--paars-d); font-size:1rem; }
.ka-bubbel::after{ content:''; position:absolute; left:-9px; bottom:8px; width:16px; height:16px; background:var(--room);
  border-left:2px solid #fff; border-bottom:2px solid #fff; transform:rotate(45deg); border-radius:0 0 0 4px; }
@media(max-width:600px){ .ka-maatje{ width:64px; height:64px; } .ka-bubbel{ font-size:.92rem; padding:11px 14px; } }

/* schermgebied */
.ka-body{ position:relative; z-index:1; padding:8px 22px 26px; }
@media(max-width:600px){ .ka-strip{ padding:14px 14px 8px; } .ka-body{ padding:6px 14px 20px; } }
.ka-scherm{ display:none; }
.ka-scherm.actief{ display:block; animation:schermIn .45s var(--ease); }
@keyframes schermIn{ from{ opacity:0; transform:translateY(16px) scale(.99);} to{ opacity:1; transform:none;} }
.ka-vraag{ font-family:var(--kop); font-weight:600; color:var(--paars); font-size:clamp(1.3rem,3.6vw,1.7rem); line-height:1.2; margin:6px 0 4px; }
.ka-uitleg{ color:var(--zacht); font-weight:400; margin:0 0 18px; font-size:.95rem; }

/* grote keuze-tegels */
.ka-grid{ display:grid; gap:12px; }
.ka-grid.k2{ grid-template-columns:1fr 1fr; }
.ka-grid.k3{ grid-template-columns:repeat(3,1fr); }
.ka-grid.k4{ grid-template-columns:repeat(4,1fr); }
@media(max-width:560px){ .ka-grid.k3,.ka-grid.k4{ grid-template-columns:1fr 1fr; } }
@media(max-width:380px){ .ka-grid.k2,.ka-grid.k3,.ka-grid.k4{ grid-template-columns:1fr; } }
.ka-tegel{ position:relative; cursor:pointer; border:3px solid var(--lijn); background:var(--wit); border-radius:var(--rad);
  padding:18px 14px; text-align:center; transition:transform .2s var(--boing), border-color .2s, box-shadow .2s; user-select:none; }
.ka-tegel:hover{ transform:translateY(-4px); box-shadow:var(--sch-m); }
.ka-tegel:active{ transform:scale(.96); }
.ka-tegel .emo{ font-size:2.6rem; display:block; line-height:1; margin-bottom:8px; transition:transform .3s var(--boing); }
.ka-tegel:hover .emo{ transform:scale(1.15) rotate(-5deg); }
.ka-tegel .lbl{ font-family:var(--kop); font-weight:500; color:var(--paars-d); font-size:1rem; line-height:1.15; }
.ka-tegel.gekozen{ border-color:var(--oranje); background:linear-gradient(180deg,#fff,var(--room)); box-shadow:var(--sch-m); }
.ka-tegel.gekozen::after{ content:'✓'; position:absolute; top:-12px; right:-12px; width:30px; height:30px; border-radius:50%;
  background:linear-gradient(135deg,var(--oranje),var(--oranje-d)); color:#fff; font-weight:800; display:flex; align-items:center; justify-content:center;
  box-shadow:var(--sch-s); animation:popm .3s var(--boing); }
@keyframes popm{ 0%{ transform:scale(0);} 100%{ transform:scale(1);} }
/* gekleurde gevoels-tegels */
.ka-tegel[data-kleur]{ border-color:transparent; }
.ka-tegel[data-kleur]::before{ content:''; position:absolute; inset:0; border-radius:inherit; opacity:.16; background:var(--tk); }
.ka-tegel[data-kleur]{ --tk:var(--lila); }

/* intensiteit (hartjes) */
.ka-intens{ display:flex; align-items:center; justify-content:center; gap:6px; margin-top:10px; }
.ka-hartje{ font-size:1.3rem; cursor:pointer; filter:grayscale(1) opacity(.4); transition:transform .2s var(--boing), filter .2s; }
.ka-hartje:hover{ transform:scale(1.25); }
.ka-hartje.aan{ filter:none; transform:scale(1.1); }

/* knoppen */
.ka-acties{ display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-top:22px; }
.ka-knop{ font-family:var(--kop); font-weight:600; font-size:1.05rem; border:none; cursor:pointer; color:#fff;
  background:linear-gradient(135deg,var(--oranje),var(--oranje-d)); padding:15px 28px; border-radius:100px;
  box-shadow:0 8px 20px rgba(200,98,42,.34); transition:transform .2s var(--boing), box-shadow .2s; display:inline-flex; align-items:center; gap:9px; }
.ka-knop:hover{ transform:translateY(-3px) scale(1.02); box-shadow:0 12px 26px rgba(200,98,42,.42); }
.ka-knop:active{ transform:scale(.95); }
.ka-knop.groen{ background:linear-gradient(135deg,var(--groen),var(--groen-d)); box-shadow:0 8px 20px rgba(92,174,110,.34); }
.ka-knop.paars{ background:linear-gradient(135deg,var(--paars),var(--paars-d)); box-shadow:0 8px 20px rgba(76,25,66,.32); }
.ka-knop.licht{ background:#fff; color:var(--paars); border:2px solid var(--lijn); box-shadow:var(--sch-s); }
.ka-terug{ background:none; border:none; cursor:pointer; font-family:var(--kop); font-weight:500; color:var(--zacht); font-size:1rem; padding:10px 6px; }
.ka-terug:hover{ color:var(--paars); }

/* invoer */
.ka-input{ width:100%; font-family:var(--tekst); font-size:1.05rem; padding:14px 18px; border-radius:16px;
  border:3px solid var(--lijn); background:var(--room); color:var(--inkt); transition:border-color .2s, background .2s; }
.ka-input:focus{ outline:none; border-color:var(--blauw); background:#fff; }
textarea.ka-input{ resize:vertical; min-height:84px; line-height:1.5; }
.ka-veldlabel{ font-family:var(--kop); font-weight:500; color:var(--paars); margin:14px 0 6px; display:block; }

/* journey / haltes */
.ka-reis{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:6px; }
@media(max-width:560px){ .ka-reis{ grid-template-columns:1fr; } }
.ka-halte{ position:relative; cursor:pointer; display:flex; align-items:center; gap:14px; padding:16px 18px;

function letBlok(soort,titel,tekst){ return '<div class="ka-let '+(soort==='warm'?'warm':'')+'"><div class="ka-let-titel">'+titel+'</div><p>'+tekst+'</p></div>'; }

/* ============ TEKENEN ============ */
var huidigCanvas=null, huidigCtx=null;
var tekenState={ kleur:TEKENKLEUREN[0], modus:'pen' };
function initCanvas(){
 var cv=document.getElementById('kaCanvas'); if(!cv) return;
 var ctx=cv.getContext('2d'); huidigCanvas=cv; huidigCtx=ctx;
 tekenState.kleur=TEKENKLEUREN[0]; tekenState.modus='pen';
 if(S.herinnering.tekening){ var img=new Image(); img.onload=function(){ ctx.drawImage(img,0,0,cv.width,cv.height); }; img.src=S.herinnering.tekening; }
 var tekenen=false;
 function pos(e){ var r=cv.getBoundingClientRect(); return { x:((e.clientX-r.left)/r.width)*cv.width, y:((e.clientY-r.top)/r.height)*cv.height }; }
 cv.addEventListener('pointerdown', function(e){ tekenen=true; var p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); cv.setPointerCapture&&cv.setPointerCapture(e.pointerId); e.preventDefault(); });
 cv.addEventListener('pointermove', function(e){ if(!tekenen) return; var p=pos(e); ctx.lineCap='round'; ctx.lineJoin='round';
   if(tekenState.modus==='gum'){ ctx.globalCompositeOperation='destination-out'; ctx.lineWidth=28; } else { ctx.globalCompositeOperation='source-over'; ctx.strokeStyle=tekenState.kleur; ctx.lineWidth=7; }
   ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); });
 function eind(){ if(!tekenen) return; tekenen=false; ctx.globalCompositeOperation='source-over'; try{ S.herinnering.tekening=cv.toDataURL('image/png'); }catch(e){} }
 cv.addEventListener('pointerup', eind); cv.addEventListener('pointerleave', eind);
}

 setTimeout(function(){ laag.innerHTML=''; }, 7000);

function leesHerinnering(){ var a=lees('inMooiste'); if(a!=null)S.herinnering.mooiste=a; var b=lees('inZeggen'); if(b!=null)S.herinnering.zeggen=b; }
function leesHelpt(){ var a=lees('inMensAnders'); if(a!=null)S.mensenAnders=a; }

/* ============ ACTIE-AFHANDELING (delegatie) ============ */
scherm.addEventListener('click', function(e){
 var t=e.target.closest('[data-act]'); if(!t) return;
 var act=t.dataset.act, val=t.dataset.val;

 if(act==='leeftijd'){ S.leeftijd=val; snd.pop(); document.querySelectorAll('[data-act="leeftijd"]').forEach(function(x){ x.classList.toggle('gekozen', x.dataset.val===val); }); return; }
 if(act==='wie'){ S.wie=val; snd.pop(); document.querySelectorAll('[data-act="wie"]').forEach(function(x){ x.classList.toggle('gekozen', x.dataset.val===val); }); return; }
 if(act==='kiesmaatje'){ leesWie(); S.maatje=val; snd.kies(); zetMaatje(); maatjeHop(); document.querySelectorAll('[data-act="kiesmaatje"]').forEach(function(x){ x.classList.toggle('gekozen', x.dataset.val===val); }); return; }
 if(act==='startreis'){ leesWie(); if(!S.maatjeNaam) S.maatjeNaam=MAATJES[S.maatje].naam; snd.kies(); naar('thuis'); return; }
 if(act==='halte'){ naar(val); return; }
 if(act==='naar'){ if(huidig==='wie')leesWie(); if(huidig==='vragen')leesVragen(); if(huidig==='herinnering')leesHerinnering(); if(huidig==='helpt')leesHelpt(); naar(val); return; }

 if(act==='gevoel'){ if(S.gevoel[val]!=null){ delete S.gevoel[val]; } else { S.gevoel[val]=2; snd.pop(); } document.getElementById('gevoelGrid').innerHTML=gevoelGridHTML(); return; }
 if(act==='intens'){ var p=val.split(':'); S.gevoel[p[0]]=parseInt(p[1],10); snd.pop(); document.getElementById('gevoelGrid').innerHTML=gevoelGridHTML(); return; }

 if(act==='begrip'){ var q=val.split(':'); var key=q[0], v=q[1]; S.begrip[key]=v; snd.pop();
   if(key==='schuld' && (v==='ja'||v==='soms')){ zegt('Lief dat je dat vertelt. Maar weet je: het is ECHT nooit jouw schuld. 💛'); maatjeHop(); }
   else if(key==='bang' && (v==='ja'||v==='soms')){ zegt('Bang zijn mag. Er zijn grote mensen die heel goed voor jou zorgen.'); maatjeHop(); }
   else if(key==='lachen' && v!=='ja'){ zegt('Lachen en spelen mag altijd, hoor. Echt waar.'); maatjeHop(); }
   document.getElementById('begripList').innerHTML=begripListHTML(); return; }

 if(act==='verder'){ var qv=val.split(':'); S.verder[qv[0]]=qv[1]; snd.pop();
   if(qv[0]==='praten' && qv[1]==='nee'){ zegt('Dat hoeft niet meteen. Misschien lukt het een keertje bij iemand die je heel goed vertrouwt.'); maatjeHop(); }
   else if(qv[0]==='slaap' && qv[1]==='nee'){ zegt('Naar slapen is niet fijn. Een knuffel of een lichtje aan kan helpen.'); maatjeHop(); }
   document.getElementById('verderList').innerHTML=verderListHTML(); return; }

 if(act==='vraagtoggle'){ var i=parseInt(val,10); var k=S.vragen.indexOf(i); if(k>-1)S.vragen.splice(k,1); else { S.vragen.push(i); snd.pop(); } t.classList.toggle('gekozen'); return; }
 if(act==='mis'){ var im=parseInt(val,10); var km=S.herinnering.mis.indexOf(im); if(km>-1)S.herinnering.mis.splice(km,1); else { S.herinnering.mis.push(im); snd.pop(); } t.classList.toggle('gekozen'); return; }
 if(act==='helpt'){ var ih=parseInt(val,10); var kh=S.helpt.indexOf(ih); if(kh>-1)S.helpt.splice(kh,1); else { S.helpt.push(ih); snd.pop(); } t.classList.toggle('gekozen'); return; }
 if(act==='mens'){ var ie=parseInt(val,10); var ke=S.mensen.indexOf(ie); if(ke>-1)S.mensen.splice(ke,1); else { S.mensen.push(ie); snd.pop(); } t.classList.toggle('gekozen'); return; }

 if(act==='kleur'){ tekenState.kleur=val; tekenState.modus='pen'; document.querySelectorAll('.ka-kleur').forEach(function(x){ x.classList.toggle('aan', x.dataset.val===val); }); document.querySelectorAll('.ka-pen').forEach(function(x){ x.classList.toggle('aan', x.dataset.val==='pen'); }); return; }
 if(act==='pen'){ tekenState.modus = (val==='gum'?'gum':'pen'); document.querySelectorAll('.ka-pen').forEach(function(x){ x.classList.toggle('aan', x.dataset.val===val); }); return; }
 if(act==='wis'){ if(huidigCtx&&huidigCanvas){ huidigCtx.clearRect(0,0,huidigCanvas.width,huidigCanvas.height); S.herinnering.tekening=''; } return; }

 if(act==='klaarhalte'){ if(val==='vragen')leesVragen(); if(val==='herinnering')leesHerinnering(); if(val==='helpt')leesHelpt(); S.klaar[val]=true; snd.kies(); naar('thuis'); return; }
 if(act==='print'){ window.print(); return; }
});

/* ============ TOPBALK + MENU ============ */
document.getElementById('btnGeluid').addEventListener('click', function(){ snd.aan=!snd.aan; this.textContent=snd.aan?'🔊':'🔇'; this.classList.toggle('uit',!snd.aan); if(snd.aan){ ac(); snd.pop(); } });

var bestandInput=document.createElement('input'); bestandInput.type='file'; bestandInput.accept='.json,application/json'; bestandInput.style.display='none'; document.body.appendChild(bestandInput);
bestandInput.addEventListener('change', function(){ var f=this.files&&this.files[0]; if(!f) return; var r=new FileReader(); r.onload=function(){ try{ var d=JSON.parse(r.result); S=Object.assign(S,d); if(!S.herinnering)S.herinnering={mooiste:'',mis:[],zeggen:'',tekening:''}; if(!S.verder)S.verder={}; zetMaatje(); sluitMenu(); naar('thuis'); }catch(e){ alert('Dit bestand kon ik niet openen.'); } }; r.readAsText(f); this.value=''; });

function bewaar(){
 try{ localStorage.setItem('afscheidsmaatje', JSON.stringify(S)); }catch(e){}
 try{ var blob=new Blob([JSON.stringify(S)],{type:'application/json'}); var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=((S.kindNaam||'mijn').replace(/[^a-z0-9]+/gi,'-'))+'-afscheidsmaatje.json'; document.body.appendChild(a); a.click(); a.remove(); }catch(e){}
}
var menuEl=null;
function openMenu(){
 if(menuEl) return;
 menuEl=document.createElement('div');
 menuEl.style.cssText='position:fixed;inset:0;z-index:50;background:rgba(63,51,64,.45);display:flex;align-items:center;justify-content:center;padding:20px;';
 menuEl.innerHTML='<div style="background:#fff;border-radius:26px;max-width:340px;width:100%;padding:24px;box-shadow:0 24px 60px rgba(76,25,66,.3);font-family:Poppins,sans-serif">'+
   '<div style="font-family:Fredoka,sans-serif;font-weight:600;color:#6C3D5C;font-size:1.2rem;margin-bottom:14px">Wat wil je doen?</div>'+
   '<button class="ka-knop groen" data-m="bewaar" style="width:100%;justify-content:center;margin-bottom:10px">💾 Opslaan op de computer</button>'+
   '<button class="ka-knop licht" data-m="laad" style="width:100%;justify-content:center;margin-bottom:10px">📂 Verdergaan met een opgeslagen reis</button>'+
   '<button class="ka-knop licht" data-m="opnieuw" style="width:100%;justify-content:center;margin-bottom:10px;color:#c8622a">↺ Opnieuw beginnen</button>'+
   '<button class="ka-terug" data-m="sluit" style="width:100%;text-align:center">Sluiten</button>'+
 '</div>';
 menuEl.addEventListener('click', function(e){
   if(e.target===menuEl){ sluitMenu(); return; }
   var b=e.target.closest('[data-m]'); if(!b) return; var m=b.dataset.m;
   if(m==='bewaar'){ bewaar(); sluitMenu(); }
   else if(m==='laad'){ bestandInput.click(); }
   else if(m==='opnieuw'){ if(confirm('Wil je echt helemaal opnieuw beginnen? Wat je hebt ingevuld gaat dan weg.')){ try{localStorage.removeItem('afscheidsmaatje');}catch(_){ } S={leeftijd:'7-9',maatje:'uil',maatjeNaam:'',kindNaam:'',wie:'',wieNaam:'',gevoel:{},begrip:{},verder:{},vragen:[],eigenVraag:'',herinnering:{mooiste:'',mis:[],zeggen:'',tekening:''},helpt:[],mensen:[],mensenAnders:'',klaar:{}}; zetMaatje(); sluitMenu(); naar('start'); } }
   else if(m==='sluit'){ sluitMenu(); }
 });
 document.body.appendChild(menuEl);
}
function sluitMenu(){ if(menuEl){ menuEl.remove(); menuEl=null; } }
document.getElementById('btnMenu').addEventListener('click', openMenu);

/* ============ HOOGTE NAAR POPUP ============ */
function stuurHoogte(){
 var h=Math.max(document.body.scrollHeight, document.documentElement.scrollHeight, document.body.offsetHeight);
 try{ window.parent.postMessage({ type:'uvp-tool-height', height:h, frameHeight:h }, '*'); }catch(e){}
}
window.addEventListener('load', stuurHoogte);
window.addEventListener('resize', function(){ setTimeout(stuurHoogte,100); });
if(window.ResizeObserver){ new ResizeObserver(function(){ stuurHoogte(); }).observe(document.body); }

/* ============ START ============ */
zetMaatje();
naar('start');
stuurHoogte();
})();

</script>
</body>
</html>
